<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crochet Tools</title>
    <meta name="description" content="Crochet tools for lace and doilies: a notation editor with stitch-count checks, symbol charts, a 3D shape preview and a row counter. Works offline; your patterns stay on your device." />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Crochet" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply the saved theme before first paint (see src/store/settings.ts).
      try {
        var s = JSON.parse(localStorage.getItem('crochet-tools:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Crochet Tools needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
