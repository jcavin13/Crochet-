[project]
name = "crolab"
version = "0.1.0"
description = "Crochet lab: stitch-graph physics, curvature, parameter fitting, swatch analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "jsonschema>=4.22",
  "opencv-contrib-python-headless>=4.10",
  "reportlab>=4.2",
  "jupytext>=1.16",
  "nbconvert>=7.16",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crolab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
