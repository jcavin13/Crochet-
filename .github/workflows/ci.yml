name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Compiled fixture graphs are up to date
        run: npm run fixtures -- --check
      - run: npm run build
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: lab } }
    env:
      # single-threaded BLAS/OpenMP: faster for the lab's small problems and no oversubscription
      # on shared runners (docs/review.md R5); crolab sets the same defaults itself
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.11.32", enable-cache: true, cache-dependency-glob: lab/uv.lock }
      - name: Install from the lock file (fails if uv.lock is out of date)
        run: uv sync --locked
      - run: uv run pytest -q
      - name: Reference spring networks (TypeScript parity contract) are current
        run: uv run python -m crolab.export_network --check
